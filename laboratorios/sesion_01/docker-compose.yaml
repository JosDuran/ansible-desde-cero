
services:
  # ----------------------------------------------------
  # Nodo de Control (Ubuntu + Code-Server + Ansible)
  # ----------------------------------------------------
  control-node:
    build:
      context: .
      dockerfile: Dockerfile.control
    container_name: ansible-control
    environment:
      - PASSWORD=ansible  # Contraseña para acceder a la web de VS Code
    volumes:
      - ./workspace:/home/ansible/workspace
    ports:
      - "8443:8443"
    networks:
      - ansible-net
    restart: unless-stopped

  # ----------------------------------------------------
  # Nodo 1: Ubuntu 22.04 (systemd + ssh)
  # ----------------------------------------------------
  ubuntu-node:
    build:
      context: .
      dockerfile: Dockerfile.ubuntu
    container_name: ansible-ubuntu
    privileged: true
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    networks:
      - ansible-net

  # ----------------------------------------------------
  # Nodo 2: Rocky Linux 9 (systemd + sshd)
  # ----------------------------------------------------
  rocky-node:
    build:
      context: .
      dockerfile: Dockerfile.rocky
    container_name: ansible-rocky
    privileged: true
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /usr/sbin/init
    networks:
      - ansible-net

networks:
  ansible-net:
    driver: bridge
